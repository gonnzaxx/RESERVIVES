version: "3.9"

services:

  # =========================================
  # PostgreSQL
  # =========================================
  db:
    build:
      context: .
      dockerfile: database/Dockerfile
    container_name: reservives-db
    restart: unless-stopped

    env_file:
      - ./backend/.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - internal

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # FastAPI
  # =========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: reservives-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      db:
        condition: service_healthy

    networks:
      - internal
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      # API bajo /api — prioridad alta para que no la capture el router del front
      - "traefik.http.routers.api.rule=Host(`vms.iesluisvives.org`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.priority=10"

      # Puerto interno FastAPI
      - "traefik.http.services.api.loadbalancer.server.port=8000"

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # =========================================
  # Flutter Web
  # =========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: reservives-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - traefik

    labels:
      - "traefik.enable=true"

      # Todo lo que NO sea /api — prioridad menor
      - "traefik.http.routers.front.rule=Host(`vms.iesluisvives.org`)"
      - "traefik.http.routers.front.entrypoints=websecure"
      - "traefik.http.routers.front.tls=true"
      - "traefik.http.routers.front.priority=1"

      # Puerto interno frontend
      - "traefik.http.services.front.loadbalancer.server.port=80"

networks:
  internal:
    driver: bridge
  traefik:
    external: true

volumes:
  postgres_data:
