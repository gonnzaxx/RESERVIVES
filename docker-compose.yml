# ============================================================
# RESERVIVES - Docker Compose
# ============================================================
# Despliega los 3 servicios: PostgreSQL, Backend (FastAPI), Frontend (Flutter Web)
#
# Uso:
#   docker-compose up --build
#
# Acceso:
#   - Frontend Web:  https://vms.iesluisvives.org:2121
#   - Backend API:   https://vms.iesluisvives.org:1212/api/docs
#   - PostgreSQL:    localhost:5432
# ============================================================

version: "3.9"

services:
  # ========================================
  # Base de datos PostgreSQL
  # ========================================
  db:
    build:
      context: .
      dockerfile: database/Dockerfile
    container_name: reservives-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Backend - Python + FastAPI
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reservives-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - traefik
    labels:
      - "traefik.enable=true"

      # BACKEND en puerto 1212 con HTTPS
      - "traefik.http.routers.api.rule=Host(`vms.iesluisvives.org`)"
      - "traefik.http.routers.api.entrypoints=api"
      - "traefik.http.routers.api.tls=true"

      # Puerto interno del contenedor
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # Frontend - Flutter Web
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reservives-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - traefik
    labels:
      - "traefik.enable=true"

      # FRONT en 2121
      - "traefik.http.routers.websecure.rule=Host(`vms.iesluisvives.org`)"
      - "traefik.http.routers.websecure.entrypoints=websecure"
      - "traefik.http.routers.websecure.tls=true"

      # Puerto interno Apache/Nginx
      - "traefik.http.services.web.loadbalancer.server.port=80"

networks:
  traefik:
    external: true

volumes:
  postgres_data:
    driver: local
