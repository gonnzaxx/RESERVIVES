<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search bar</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded">
<style>
  body { margin:0; padding:24px; background:var(--rv-bg); font-family:var(--rv-font); }
  .search {
    display:flex; align-items:center; gap:10px;
    background:#fff; border-radius:16px; padding:12px 14px;
    box-shadow: 0 8px 24px rgba(16,19,26,.08);
  }
  .search .material-symbols-rounded.lead { color:#B53F7A; font-size:20px; }
  .search input {
    border:none; outline:none; flex:1;
    font:400 15px var(--rv-font); color:#10131A; background:transparent;
  }
  .search input::placeholder { color:#8E8E93; }
  .search .material-symbols-rounded.tail { color:#667085; font-size:18px; cursor:pointer; }
  .field {
    margin-top:14px;
    background:#F2F2F7; border-radius:10px; padding:14px 16px;
    font:400 15px var(--rv-font); color:#8E8E93;
    border:1.5px solid transparent;
  }
  .field.focused { border-color:#B53F7A; background:#fff; color:#10131A; }
</style>
</head>
<body>
  <div class="search">
    <span class="material-symbols-rounded lead">search</span>
    <input placeholder="Buscar espacios, servicios o anuncios…" value="Aula multimedia">
    <span class="material-symbols-rounded tail">close</span>
  </div>
  <div class="field focused">Reservives@iesluisvives.org</div>
</body>
</html>
