<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family:var(--rv-font); }
  table { width:100%; border-collapse: collapse; }
  td { padding:6px 8px; border-bottom:1px solid #F0F1F5; vertical-align: middle; }
  td.k { font:700 11px/1.3 var(--rv-font); color:#667085; letter-spacing:.4px; text-transform:uppercase; width: 64px; }
  td.v { font:600 11px/1.3 var(--rv-font); color:#10131A; width:48px; text-align:right; }
  .bar { height:14px; background: var(--rv-gradient-brand); border-radius:4px; }
</style>
</head>
<body>
<table>
  <tr><td class="k">space-1</td><td><div class="bar" style="width:4px"></div></td><td class="v">4 px</td></tr>
  <tr><td class="k">space-2</td><td><div class="bar" style="width:8px"></div></td><td class="v">8 px</td></tr>
  <tr><td class="k">space-3</td><td><div class="bar" style="width:12px"></div></td><td class="v">12 px</td></tr>
  <tr><td class="k">space-4</td><td><div class="bar" style="width:16px"></div></td><td class="v">16 px</td></tr>
  <tr><td class="k">space-5</td><td><div class="bar" style="width:20px"></div></td><td class="v">20 px</td></tr>
  <tr><td class="k">space-6</td><td><div class="bar" style="width:24px"></div></td><td class="v">24 px</td></tr>
  <tr><td class="k">space-7</td><td><div class="bar" style="width:32px"></div></td><td class="v">32 px</td></tr>
  <tr><td class="k">space-8</td><td><div class="bar" style="width:40px"></div></td><td class="v">40 px</td></tr>
</table>
</body>
</html>
