<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 24px; background: linear-gradient(135deg,#FFFFFF 0%,#F2F4FF 60%,#E9F0FF 100%); font-family:var(--rv-font); display:flex; gap:24px; align-items:center; }
  .lockup { display:flex; align-items:center; gap:14px; }
  .lockup img { width:96px; height:96px; object-fit:contain; }
  .name { font:900 22px/1.05 var(--rv-font); letter-spacing:-.6px; color:#10131A; }
  .sub { font:500 12px/1.5 var(--rv-font); color:#667085; }
  .dark-bg { padding:14px 16px; border-radius:14px; background:#090B10; display:flex; align-items:center; gap:12px; }
  .dark-bg img { width:80px; height:80px; object-fit:contain; }
  .dark-bg .name { color:#fff }
  .dark-bg .sub { color:#B0B9CD }
</style>
</head>
<body>
  <div class="lockup">
    <img src="../assets/logo_luis_vives.png" alt="IES Luis Vives">
    <div>
      <div class="name">Reservives</div>
      <div class="sub">IES Luis Vives</div>
    </div>
  </div>
  <div class="dark-bg">
    <img src="../assets/logo_luis_vives_oscuro.png" alt="IES Luis Vives oscuro">
    <div>
      <div class="name">Reservives</div>
      <div class="sub">Modo oscuro</div>
    </div>
  </div>
</body>
</html>
