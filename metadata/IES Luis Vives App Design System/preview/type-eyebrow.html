<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eyebrow + Title pairing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px 28px 24px; background:#fff; font-family:var(--rv-font); color:#10131A; }
  .eyebrow { font:700 11px/1.4 var(--rv-font); letter-spacing:1.0px; text-transform:uppercase; color:#667085; margin-bottom:6px; }
  .title { font:800 30px/1.05 var(--rv-font); letter-spacing:-1.2px; }
  .sub { margin-top:8px; font:400 14px/1.4 var(--rv-font); color:#667085; max-width:520px; }
  .pair + .pair { margin-top:18px; }
  .pair2 .title { font:900 26px/1.05 var(--rv-font); color:#D23F7A; letter-spacing:-.8px; }
</style>
</head>
<body>
  <div class="pair">
    <div class="eyebrow">buenos días</div>
    <div class="title">Marina</div>
  </div>
  <div class="pair pair2" style="margin-top:22px">
    <div class="eyebrow">bienvenido/a a</div>
    <div class="title">Reservives — IES Luis Vives</div>
  </div>
</body>
</html>
