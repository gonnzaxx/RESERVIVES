<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand & social icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded">
<style>
  body { margin:0; padding:20px 24px; background:#fff; font-family:var(--rv-font); }
  .group + .group { margin-top:16px; padding-top:14px; border-top:1px solid #F0F1F5; }
  .lab { font:700 10px/1.3 var(--rv-font); letter-spacing:.6px; color:#667085; text-transform:uppercase; margin-bottom:8px;}
  .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .ic { width:34px; height:34px; object-fit:contain; }
  .mat { color:#B53F7A; font-size:24px; }
  .mat-muted { color:#667085; font-size:24px; }
</style>
</head>
<body>
  <div class="group">
    <div class="lab">brand bitmaps · /assets</div>
    <div class="row">
      <img class="ic" src="../assets/microsoft_icon.png" title="microsoft_icon.png">
      <img class="ic" src="../assets/linkedin_icon.png" title="linkedin_icon.png">
      <img class="ic" src="../assets/x_icon.png" title="x_icon.png">
      <img class="ic" src="../assets/youtube_icon.png" title="youtube_icon.png">
    </div>
  </div>
  <div class="group">
    <div class="lab">UI · material symbols rounded · accent</div>
    <div class="row">
      <span class="material-symbols-rounded mat">search</span>
      <span class="material-symbols-rounded mat">notifications</span>
      <span class="material-symbols-rounded mat">how_to_vote</span>
      <span class="material-symbols-rounded mat">bolt</span>
      <span class="material-symbols-rounded mat">push_pin</span>
      <span class="material-symbols-rounded mat">event_busy</span>
      <span class="material-symbols-rounded mat">place</span>
      <span class="material-symbols-rounded mat">schedule</span>
      <span class="material-symbols-rounded mat">cloud_off</span>
    </div>
  </div>
</body>
</html>
