<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switch tile</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded">
<style>
  body { margin:0; padding:18px 24px; background:#F0F1F5; font-family:var(--rv-font); display:flex; flex-direction:column; gap:10px; }
  .tile {
    background:#fff; border-radius:20px; padding:14px 16px;
    border:1.5px solid rgba(16,19,26,.05);
    box-shadow: 0 8px 24px rgba(16,19,26,.08);
    display:flex; align-items:center; gap:12px;
  }
  .ico { width:44px; height:44px; border-radius:14px; background:rgba(181,63,122,.12); display:flex; align-items:center; justify-content:center; color:#B53F7A; flex-shrink:0; }
  .ico .material-symbols-rounded { font-size:22px; }
  .body { flex:1; }
  .t { font:600 15px/1.3 var(--rv-font); }
  .s { font:500 12px/1.5 var(--rv-font); color:#667085; }
  .switch { width:44px; height:26px; border-radius:999px; background:#B53F7A; position:relative; flex-shrink:0; }
  .switch.off { background:#E6E8F0; }
  .knob { width:22px; height:22px; border-radius:50%; background:#fff; position:absolute; top:2px; right:2px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.off .knob { right:auto; left:2px; }
</style>
</head>
<body>
  <div class="tile">
    <div class="ico"><span class="material-symbols-rounded">notifications_active</span></div>
    <div class="body">
      <div class="t">Notificaciones push</div>
      <div class="s">Recibe avisos cuando se libere una plaza en lista de espera.</div>
    </div>
    <div class="switch"><div class="knob"></div></div>
  </div>
  <div class="tile">
    <div class="ico"><span class="material-symbols-rounded">dark_mode</span></div>
    <div class="body">
      <div class="t">Tema oscuro</div>
      <div class="s">Sigue la configuración del sistema.</div>
    </div>
    <div class="switch off"><div class="knob"></div></div>
  </div>
</body>
</html>
