<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--rv-bg); font-family:var(--rv-font); }
  .row { display:grid; grid-template-columns: repeat(5, 1fr); gap:14px; }
  .box { aspect-ratio: 1.3 / 1; background:#fff; border:1px solid #E6E8F0; box-shadow: var(--rv-shadow-soft); display:flex; align-items:flex-end; padding:10px; }
  .lab { font:700 11px/1.2 var(--rv-font); color:#10131A; }
  .val { font:600 10px/1.4 var(--rv-font); color:#667085; }
  .pill { background: var(--rv-gradient-brand); border-radius:999px; color:#fff; padding:6px 14px; font:700 12px var(--rv-font); }
</style>
</head>
<body>
  <div class="row">
    <div class="box" style="border-radius:10px"><div><div class="lab">s — input</div><div class="val">10 px</div></div></div>
    <div class="box" style="border-radius:14px"><div><div class="lab">m — button · card</div><div class="val">14 px</div></div></div>
    <div class="box" style="border-radius:20px"><div><div class="lab">l — surface</div><div class="val">20 px</div></div></div>
    <div class="box" style="border-radius:32px"><div><div class="lab">xl</div><div class="val">32 px</div></div></div>
    <div class="box" style="border-radius:999px;align-items:center;justify-content:center;background:transparent;border:none;box-shadow:none">
      <span class="pill">pill · 999</span>
    </div>
  </div>
</body>
</html>
