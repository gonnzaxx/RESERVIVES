<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded">
<style>
  body { margin:0; padding:28px 24px; background:#fff; font-family:var(--rv-font); display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .badge {
    display:inline-flex; align-items:center; gap:4px;
    padding:4px 9px; border-radius:999px;
    font:800 10px/1.2 var(--rv-font); letter-spacing:.3px;
  }
  .badge .material-symbols-rounded { font-size:12px; font-variation-settings: 'FILL' 1; }
  .b-success { background: rgba(46,196,141,.12); color:#1F8E66; }
  .b-warn { background: rgba(255,176,32,.14); color:#A86A00; }
  .b-error { background: rgba(255,93,115,.12); color:#D33149; }
  .b-blue { background: rgba(50,137,236,.12); color:#1F65B5; }
  .b-accent { background: rgba(181,63,122,.12); color:#B53F7A; }
  .b-pin { background: rgba(170,31,255,.12); color:#7E12BF; }
  .b-pill { background: rgba(181,63,122,.10); color:#B53F7A; padding:5px 10px; gap:4px; font-weight:700; font-size:11px; letter-spacing:0; text-transform:none; }
</style>
</head>
<body>
  <span class="badge b-success"><span class="material-symbols-rounded">check_circle</span>APROBADA</span>
  <span class="badge b-warn"><span class="material-symbols-rounded">schedule</span>PENDIENTE</span>
  <span class="badge b-error"><span class="material-symbols-rounded">cancel</span>RECHAZADA</span>
  <span class="badge b-blue"><span class="material-symbols-rounded">place</span>AULA 204</span>
  <span class="badge b-accent">12 TOKENS</span>
  <span class="badge b-pin"><span class="material-symbols-rounded">push_pin</span>DESTACADO</span>
  <span class="badge b-pill"><span class="material-symbols-rounded">bolt</span>Actualizado hoy</span>
</body>
</html>
